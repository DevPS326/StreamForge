# Free demo backend. Existing Render resources are adopted; no paid services.
services:
  - type: web
    name: streamforge-api-devps326
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/DevPS326/StreamForge
    branch: main
    buildCommand: npm install -g pnpm@11.29.0 && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @streamforge/api build && pnpm --filter @streamforge/worker build
    startCommand: pnpm --filter @streamforge/db migrate && node scripts/start-free-demo.mjs
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: streamforge-db-free
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: API_PUBLIC_URL
        value: https://streamforge-api-devps326.onrender.com
      - key: WEB_ORIGIN
        value: https://stream-forge-flame.vercel.app,https://stream-forge-dev-pratap-singhs-projects-72d953f1.vercel.app,https://stream-forge-d7jg17zx0-dev-pratap-singhs-projects-72d953f1.vercel.app
      - key: DEMO_FREE_MODE
        value: "1"
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      - key: USER_QUOTA_BYTES
        value: "209715200"
      - key: MAX_ACTIVE_UPLOADS
        value: "1"
      - key: MEDIA_TOKEN_TTL_SECONDS
        value: "120"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: WORKER_FFMPEG_THREADS
        value: "1"
      - key: WORKER_MAX_DURATION_SECONDS
        value: "45"
      - key: WORKER_TIMEOUT_SECONDS
        value: "900"
      - key: WORKER_MAX_ATTEMPTS
        value: "2"
      - key: WORKER_TEMP_BUDGET_BYTES
        value: "536870912"

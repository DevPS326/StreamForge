name: streamforge

x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgresql://streamforge:streamforge@postgres:5432/streamforge?schema=public
  S3_REGION: us-east-1
  AWS_REGION: us-east-1
  S3_BUCKET: streamforge-media
  S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: streamforge-local
  AWS_SECRET_ACCESS_KEY: streamforge-local-storage
  SQS_ENDPOINT: http://queue:9324
  SQS_QUEUE_URL: http://queue:9324/queue/streamforge-processing

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: streamforge
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: streamforge
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U streamforge -d streamforge"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: streamforge-local
      MINIO_ROOT_PASSWORD: streamforge-local-storage
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15

  storage-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z@sha256:b532278b7a3747dbab6fe45eebb40a653efa704e6758e24e9d9ec54fc96c1800
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 streamforge-local streamforge-local-storage &&
             mc mb --ignore-existing local/streamforge-media; then
            mc anonymous set none local/streamforge-media
            exit 0
          fi
          sleep 2
        done
        exit 1

  queue:
    image: softwaremill/elasticmq-native:1.7.1
    ports: ["127.0.0.1:9324:9324"]
    volumes:
      - ./infrastructure/docker/elasticmq.conf:/opt/elasticmq.conf:ro
      - queue-data:/data
    healthcheck:
      test:
        [
          CMD,
          wget,
          -q,
          -O,
          /dev/null,
          "http://127.0.0.1:9324/?Action=ListQueues",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: migrate
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      API_PUBLIC_URL: http://localhost:4000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      MEDIA_TOKEN_SECRET: local-development-only-replace-with-a-random-32-byte-secret
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      queue: { condition: service_healthy }
    init: true

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: worker
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "1"
      WORKER_FFMPEG_THREADS: "2"
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      queue: { condition: service_healthy }
    init: true
    cpus: 3
    mem_limit: 3g
    stop_grace_period: 45s

volumes:
  postgres-data:
  minio-data:
  queue-data:

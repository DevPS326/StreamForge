include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}
rest-stats.enabled = false

queues {
  streamforge-processing-dlq {
    message-retention-period = 14 days
  }
  streamforge-processing {
    default-visibility-timeout = 90 seconds
    receive-message-wait = 15 seconds
    message-retention-period = 4 days
    dead-letters-queue {
      name = "streamforge-processing-dlq"
      max-receive-count = 12
    }
  }
}
messages-storage.enabled = true

name: StreamForge production smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Production registration, R2 upload, FFmpeg and download
        run: node scripts/live-smoke.mjs
        env:
          SMOKE_ORIGIN: https://stream-forge-flame.vercel.app

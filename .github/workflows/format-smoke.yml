name: One-time smoke formatter
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-smoke.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/live-smoke.mjs
      - name: Save formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/live-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format production smoke test"
            git push origin HEAD:main
          fi

name: Publish container images
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  images:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [api, worker, migrate]
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISH_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_PREFIX }}-${{ matrix.target }}:${{ github.sha }}
      - name: Record immutable reference
        env:
          IMAGE_REF: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_PREFIX }}-${{ matrix.target }}@${{ steps.image.outputs.digest }}
        run: printf '%s\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
